name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --release --target x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/lu-battery.exe"
          $zip = "lu-battery-${{ github.ref_name }}-windows-x64.zip"
          Copy-Item $exe lu-battery.exe
          Compress-Archive -Path lu-battery.exe, README.md, LICENSE -DestinationPath $zip
          (Get-FileHash lu-battery.exe -Algorithm SHA256).Hash + "  lu-battery.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          (Get-FileHash $zip -Algorithm SHA256).Hash + "  $zip" | Out-File -Encoding ascii -Append SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lu-battery.exe
            lu-battery-${{ github.ref_name }}-windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
